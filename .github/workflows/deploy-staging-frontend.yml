name: Deploy Staging Frontend

on:
  push:
    branches:
      - staging

jobs:
  deploy-staging-frontend:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: trial1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'

      - name: Create .env file for Flutter Web
        run: |
          echo "${{ secrets.FLUTTER_ENV }}" > .env

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter web
        run: flutter build web --release

      - name: Delete old HTML files
        run: |
          sudo rm -rf /var/www/unidash/*

      - name: Copy build files to web server
        run: |
          sudo cp -r build/web/* /var/www/unidash/

      # Add more steps as needed for cache busting, versioning, etc.
