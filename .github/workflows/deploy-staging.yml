name: Deploy Staging Backend

on:
  push:
    branches:
      - staging
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-staging.yml'
  workflow_dispatch:

jobs:
  deploy-staging:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Create Firebase credentials file
        run: |
          echo '${{ secrets.FIREBASE_ADMIN_CREDENTIALS }}' > backend/credentials.json

      - name: Create environment variables file
        # Using a staging specific secret if available, otherwise fallback to standard
        run: |
          if [ -n "${{ secrets.STAGING_ENVIRONMENT }}" ]; then
            echo '${{ secrets.STAGING_ENVIRONMENT }}' > backend/.env.staging
         
          fi

      - name: Deploy staging backend stack with Redis
        working-directory: backend
        run: |
          docker compose -p unidash-staging -f docker-compose.staging.yml up -d --build --remove-orphans

      - name: Clean unused images
        run: docker image prune -f
