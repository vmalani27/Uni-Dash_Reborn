name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Create Firebase credentials file
        run: |
          echo '${{ secrets.FIREBASE_ADMIN_CREDENTIALS }}' > backend/credentials.json

      - name: Create environment variables file
        run: |
          echo '${{ secrets.ENVIRONMENT_VARIABLES }}' > backend/.env


      - name: Build Docker image
        working-directory: backend
        run: docker build -t unidash-backend .

      - name: Stop old container
        run: |
          docker stop unidash-backend || true
          docker rm unidash-backend || true

      - name: Start new container
        run: |
          docker run -d \
          --name unidash-backend \
          -p 8000:8000 \
          -v /home/barf/actions-runner/_work/Uni-Dash_Reborn/Uni-Dash_Reborn/backend/.env:/backend/.env \
          -v /home/barf/actions-runner/_work/Uni-Dash_Reborn/Uni-Dash_Reborn/backend/credentials.json:/backend/app/core/credentials.json \
          unidash-backend